name: Auto release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags so the "already released?" guard actually
          # sees existing tags (default checkout fetches with --no-tags).
          fetch-depth: 0

      - name: Read version and decide whether to release
        id: version
        run: |
          VERSION=$(grep -m1 '^Version:' ajax-snippets.php | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          RELEASE=true
          if [ -z "$VERSION" ]; then
            echo "No Version header found."; RELEASE=false
          elif printf '%s' "$VERSION" | grep -q '-'; then
            echo "Prerelease version ${VERSION}; not releasing to the fleet."; RELEASE=false
          elif git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; nothing to do."; RELEASE=false
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release decision: ${RELEASE} (version=${VERSION})"

      - name: Verify version consistency
        if: steps.version.outputs.release == 'true'
        run: |
          HEADER="${{ steps.version.outputs.version }}"
          CONST=$(grep -m1 "define('AJAX_SNIPPETS_VERSION'" ajax-snippets.php | sed -E "s/.*,[[:space:]]*'([^']+)'.*/\1/")
          if [ "$HEADER" != "$CONST" ]; then
            echo "::error::Version header ($HEADER) != AJAX_SNIPPETS_VERSION constant ($CONST). Sync them before releasing."
            exit 1
          fi
          echo "Version header and constant agree: ${HEADER}"

      - name: Setup PHP
        if: steps.version.outputs.release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Verify bundled assets
        if: steps.version.outputs.release == 'true'
        run: |
          test -f vendor/yahnis-elsts/plugin-update-checker/load-v5p6.php
          # Select2 is vendored into the repo (no CDN fetch at release time).
          test -f assets/js/select2.min.js
          test -f assets/css/select2.min.css

      - name: Build zip
        if: steps.version.outputs.release == 'true'
        run: |
          PLUGIN_SLUG="ajax-snippets"
          ZIP_NAME="${PLUGIN_SLUG}.zip"
          mkdir -p build
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'build' \
            --exclude '*.zip' \
            --exclude 'build-zip.sh' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'node_modules' \
            ./ "build/${PLUGIN_SLUG}/"
          (cd build && zip -r "../${ZIP_NAME}" "${PLUGIN_SLUG}")

      - name: Verify built package
        if: steps.version.outputs.release == 'true'
        run: |
          PLUGIN_SLUG="ajax-snippets"
          DIR="build/${PLUGIN_SLUG}"
          # Lint every PHP file that will ship — a parse error must never reach a site.
          find "$DIR" -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null
          # Confirm the runtime deps and vendored assets actually landed in the zip.
          test -f "${DIR}/vendor/yahnis-elsts/plugin-update-checker/load-v5p6.php"
          test -f "${DIR}/assets/js/select2.min.js"
          test -f "${DIR}/assets/css/select2.min.css"
          # Header inside the packaged file must still match the tag being cut.
          PKG_VER=$(grep -m1 '^Version:' "${DIR}/ajax-snippets.php" | awk '{print $2}')
          test "$PKG_VER" = "${{ steps.version.outputs.version }}"

      # Tag + release + asset upload happen LAST, only after build & verify pass,
      # so a tagged release can never point at a broken or asset-less build.
      - name: Create tag, release and upload asset
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: "ajax-snippets.zip"
